{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">创建新比赛</h1>
<form method="POST" class="needs-validation" novalidate>
    <div class="mb-3">
        <label class="form-label">参赛人数（4-12）:</label>
        <input type="number" class="form-control" name="player_count" min="4" max="12" required>
        <div class="invalid-feedback">请输入4-12之间的数字</div>
    </div>
    <div class="mb-3">
        <label class="form-label">比赛时间:</label>
        <input type="datetime-local" class="form-control" name="time" required>
        <div class="invalid-feedback">请选择比赛时间</div>
    </div>
    <div class="mb-3">
        <label class="form-label">比赛地点:</label>
        <div class="d-flex flex-wrap gap-2 mb-2">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="location_select" id="loc1" value="保利和光" checked>
                <label class="form-check-label" for="loc1">保利和光</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="location_select" id="loc2" value="保利云启">
                <label class="form-check-label" for="loc2">保利云启</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="location_select" id="loc3" value="林上湾">
                <label class="form-check-label" for="loc3">林上湾</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="location_select" id="loc4" value="中海">
                <label class="form-check-label" for="loc4">中海</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="location_select" id="loc_custom" value="custom">
                <label class="form-check-label" for="loc_custom">自定义</label>
            </div>
        </div>
        <input type="text" class="form-control" id="location_input" name="location" value="保利和光" readonly required>
        <div class="invalid-feedback">请输入比赛地点</div>
    </div>
    <h3 class="mt-4">选手信息</h3>
    <div id="players" class="mb-3"></div>
    <h3 class="mt-4">积分规则</h3>
    <div id="rules" class="mb-3"></div>
    <button type="submit" class="btn btn-success">创建比赛</button>
</form>

<script>
document.querySelector('[name="player_count"]').addEventListener('change', function() {
    const count = parseInt(this.value);
    let playersHtml = '';
    let rulesHtml = '';

    // 默认积分规则
    const defaultPoints = {
        4: [14, 8, 4, 0],
        6: [20, 16, 12, 8, 4, 0],
        8: [30, 24, 20, 16, 12, 8, 4, 0],
        10: [50, 42, 36, 30, 24, 18, 12, 8, 4, 0]
    };

    // 生成选手输入框
    for(let i = 1; i <= count; i++) {
        playersHtml += `
            <div class="mb-2">
                <label class="form-label">选手 ${i} 姓名:</label>
                <input type="text" class="form-control" name="player_${i}" required>
                <div class="invalid-feedback">请输入选手姓名</div>
            </div>`;
    }

    // 生成积分规则输入框并填充默认值
    if (defaultPoints[count]) {
        const points = defaultPoints[count];
        for(let i = 1; i <= count; i++) {
            rulesHtml += `
                <div class="mb-2">
                    <label class="form-label">第 ${i} 名积分:</label>
                    <input type="number" class="form-control" name="points_${i}" value="${points[i-1]}" required>
                    <div class="invalid-feedback">请输入积分</div>
                </div>`;
        }
    } else {
        // 如果人数不在默认规则中，生成空输入框
        for(let i = 1; i <= count; i++) {
            rulesHtml += `
                <div class="mb-2">
                    <label class="form-label">第 ${i} 名积分:</label>
                    <input type="number" class="form-control" name="points_${i}" required>
                    <div class="invalid-feedback">请输入积分</div>
                </div>`;
        }
    }

    document.getElementById('players').innerHTML = playersHtml;
    document.getElementById('rules').innerHTML = rulesHtml;
});

// 地点选择逻辑
const locationRadios = document.querySelectorAll('input[name="location_select"]');
const locationInput = document.getElementById('location_input');

locationRadios.forEach(radio => {
    radio.addEventListener('change', function() {
        if (this.value === 'custom') {
            locationInput.readOnly = false;
            locationInput.value = '';
            locationInput.focus();
            locationInput.placeholder = "请输入自定义地点";
        } else {
            locationInput.readOnly = true;
            locationInput.value = this.value;
            locationInput.placeholder = "";
        }
    });
});

// Bootstrap 表单验证
(() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})();
</script>
{% endblock %}
